<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twemoji Resurrection</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; font-family: sans-serif;
    background: light-dark(#f7f7fa, #121216); color: light-dark(#222, #e8e8ee);
  }
  header {
    position: sticky; top: 0; z-index: 1; padding: 12px 16px;
    background: light-dark(#ffffffee, #121216ee); backdrop-filter: blur(8px);
    border-bottom: 1px solid light-dark(#e3e3ea, #2a2a32);
  }
  header h1 { margin: 0 0 4px; font-size: 18px; }
  #status { font-size: 13px; color: #888; }
  #status.ok { color: #2e9e44; } #status.warn { color: #c98a00; } #status.bad { color: #d0453c; }
  nav {
    display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px 2px;
    position: sticky; top: 58px; background: light-dark(#f7f7faee, #121216ee);
  }
  nav a {
    flex: none; padding: 6px 12px; border-radius: 999px; text-decoration: none;
    font-size: 13px; border: 1px solid light-dark(#d8d8e2, #34343e);
    color: light-dark(#444, #ccc);
  }
  section { padding: 4px 16px 24px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; opacity: .65; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); }
  .grid span {
    font-size: 30px; text-align: center; padding: 6px 0; cursor: default;
    border-radius: 8px; font-family: "Noto Color Emoji", "Twemoji", sans-serif;
  }
  .grid span:empty::after { content: "□"; opacity: .2; }
  footer { padding: 12px 16px 28px; font-size: 12px; color: #888; }
  #bar {
    margin-top: 8px; height: 6px; border-radius: 3px; overflow: hidden;
    background: light-dark(#e3e3ea, #2a2a32);
  }
  #bar > div { height: 100%; width: 0; border-radius: 3px; background: #2e9e44; transition: width .4s; }
  #barnote { margin-top: 5px; font-size: 11.5px; color: #888; }
  #diag { padding-top: 14px; }
  .slot {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px; margin-bottom: 6px;
    border-radius: 10px; font-size: 13px;
    background: light-dark(#ffffff, #1c1c22);
    border: 1px solid light-dark(#e3e3ea, #2a2a32);
  }
  .slot .ic { font-size: 15px; }
  .slot .nm { font-family: monospace; font-size: 12.5px; flex: 1; word-break: break-all; }
  .slot .lb { color: #888; font-size: 12px; text-align: right; }
  .slot.bad  { border-color: #d0453c66; }
  .slot.skip { opacity: .55; }
</style>
</head>
<body>
<header>
  <h1>Twemoji Resurrection <span id="ver"></span></h1>
  <div id="status">checking module status…</div>
  <div id="bar"><div></div></div>
  <div id="barnote"></div>
</header>
<section id="diag" style="display:none">
  <h2>Emoji font slots</h2>
  <div id="slots"></div>
</section>
<nav id="nav"></nav>
<main id="main"></main>
<footer>
  Every glyph below is rendered by your <b>current system emoji font</b> — this is
  the real replacement result, not bundled artwork. A hollow box means the glyph
  is missing from the installed font.
</footer>

// Build sections + nav
const nav = document.getElementById("nav");
const main = document.getElementById("main");
// Grapheme segmentation keeps ZWJ sequences (e.g. 👨‍👩‍👧) as single glyphs.
// Intl.Segmenter is missing on old WebViews — degrade to a regex approximation
// (property escapes need WebView ≥64) instead of aborting the page, so the
// self-check below always gets to run.
function graphemes(chars) {
  if (typeof Intl.Segmenter === "function")
    return [...new Intl.Segmenter("en", { granularity: "grapheme" }).segment(chars)].map(s => s.segment);
  try {
    return chars.match(/\p{RI}{2}|\P{M}(?:[\u{1F3FB}-\u{1F3FF}]|[\uFE0E\uFE0F]|\u20E3|\u200D\P{M})*/gu) || [...chars];
  } catch {
    return [...chars];
  }
}
try {
  for (const [name, chars] of Object.entries(GROUPS)) {
    const id = name.toLowerCase().replace(/[^a-z]+/g, "-");
    nav.insertAdjacentHTML("beforeend", `<a href="#${id}">${name}</a>`);
    const section = document.createElement("section");
    section.id = id;
    section.innerHTML = `<h2>${name}</h2>`;
    const grid = document.createElement("div");
    grid.className = "grid";
    for (const s of graphemes(chars)) {
      let t = s;
      // Legacy symbols (☺ ⚠ ❄ ☂ …) default to TEXT presentation and render
      // as monochrome outlines unless explicitly followed by VS16 (U+FE0F).
      if ([...t].length === 1 && !t.endsWith("\uFE0F")) t += "\uFE0F";
      const sp = document.createElement("span");
      sp.textContent = t;
      sp.title = [...s].map(c => "U+" + c.codePointAt(0).toString(16).toUpperCase().padStart(4, "0")).join(" ");
      grid.appendChild(sp);
    }
    section.appendChild(grid);
    main.appendChild(section);
  }
} catch (e) { /* the gallery is decoration — diagnostics must survive it */ }

// ---- Self-check -------------------------------------------------------------
// Runs the same verification as post-fs-data.sh (does every emoji font slot
// declared by the system actually serve the module's Twemoji file?) but live
// and in detail, via the manager's root shell bridge (KernelSU / SukiSU /
// APatch native; Magisk through WebUIX). Falls back to the boot-time
// description when no bridge is available.
const st = document.getElementById("status");
const MODDIR = "/data/adb/modules/Twemoji-systemless";

// One plain script call — no shell is generated on the JS side. The shared
// checker emits "path<TAB>OK|FAIL|ABSENT" per slot (real tabs, printf'd).
const CHECK_CMD = `sh ${MODDIR}/bin/emoji-slots.sh check`;

// Manager bridges disagree on the exec() return shape: the official KernelSU
// native WebViewInterface.exec(cmd) returns stdout as a plain String, while
// the optional JS wrapper (module-webui guide / npm kernelsu package)
// resolves an object { errno, stdout, stderr }. Adapt both.
function execOut(r) {
  if (typeof r === "string") return r;
  return (r && (r.stdout ?? r.result ?? "")) || "";
}
async function bridgeExec(cmd) {
  return execOut(await ksu.exec(cmd));
}

function badgeFor(ok, total) {
  if (total > 0 && ok === total) return ["✅", "ok", `Twemoji active — all ${ok}/${total} emoji fonts replaced`];
  if (ok > 0) return ["⚠️", "warn", `Twemoji partial — only ${ok}/${total} emoji fonts replaced`];
  return ["❌", "bad", "Twemoji not active — nothing replaced yet"];
}

function renderSlots(rows) {
  const host = document.getElementById("slots");
  host.innerHTML = "";
  for (const [name, state] of rows) {
    const [icon, cls, label] =
      state === "OK"    ? ["✅", "ok",   "serving Twemoji"] :
      state === "FAIL"  ? ["❌", "bad",  "still the stock font"] :
                          ["➖", "skip", "not present on this system"];
    const row = document.createElement("div");
    row.className = "slot " + cls;
    row.innerHTML = `<span class="ic">${icon}</span><span class="nm">${name}</span><span class="lb">${label}</span>`;
    host.appendChild(row);
  }
  document.getElementById("diag").style.display = "block";
}

(async () => {
  let done = false;
  try {
    if (window.ksu && ksu.exec) {
      const out = await bridgeExec(CHECK_CMD);
      const rows = out.split("\n")
        .map(l => l.split("\t").map(s => s.trim()))
        .filter(a => a.length === 2 && a[0] && /^(OK|FAIL|ABSENT)$/.test(a[1]));
      if (rows.length) {
        const existing = rows.filter(a => a[1] !== "ABSENT");
        const ok = existing.filter(a => a[1] === "OK").length;
        const total = existing.length;
        const [icon, cls, text] = badgeFor(ok, total);
        st.innerHTML = `${icon} ${text}`;
        st.className = cls;
        const bar = document.getElementById("bar");
        bar.firstElementChild.style.width = total ? (100 * ok / total) + "%" : "0";
        document.getElementById("barnote").textContent =
          `${ok} of ${total} emoji font slots on this system serve Twemoji` +
          (rows.length > total ? ` · ${rows.length - total} declared slot(s) absent` : "");
        renderSlots(rows);
        try {
          const prop = await bridgeExec(`cat ${MODDIR}/module.prop`);
          document.getElementById("ver").textContent = (prop.match(/^version=(.*)$/m) || [])[1] || "";
        } catch (e) { /* the version line is optional */ }
        done = true;
      }
    }
  } catch (e) { /* fall through to description fallback */ }
  if (!done) {
    try {
      const out = await bridgeExec(`cat ${MODDIR}/module.prop`);
      const desc = (out.match(/^description=(.*)$/m) || [])[1] || "";
      const ver = (out.match(/^version=(.*)$/m) || [])[1] || "";
      document.getElementById("ver").textContent = ver;
      st.textContent = desc ? desc + " (boot-time status — live check unavailable)" : "installed";
      st.className = /✅/.test(desc) ? "ok" : /⚠️/.test(desc) ? "warn" : /❌/.test(desc) ? "bad" : "";
    } catch {
      st.textContent = "manager without WebUI bridge — emoji below still reflect your system font";
    }
  }
})();
</script>
